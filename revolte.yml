revolte:
  version: '1.0'
  project: Strike
  appName: Knight
  env:
    staging:
      branch: main
      services:
        rid_1:
          type: WEB_APP
          name: web-app_service
          entryPoint: index.js
          properties:
            indexPage: index.html
            errorPage: error.html
            variables:
              BASE_URL: /api/v1
    qa:
      branch: patch-1
      services:
        rid_1:
          type: WEB_APP
          name: web-app_service
          entryPoint: index.js
          properties:
            indexPage: index.html
            errorPage: error.html
            variables:
              BASE_URL: /api/v1
    production:
      branch: main
      services:
        rid_1:
          type: WEB_APP
          name: web-app_service
          entryPoint: index.js
          properties:
            indexPage: index.html
            errorPage: error.html
            variables:
              BASE_URL: /api/v1
    preview:
      services:
        rid_1:
          type: WEB_APP
          name: web-app_service
          entryPoint: index.js
          properties:
            indexPage: index.html
            errorPage: error.html
            variables:
              BASE_URL: /api/v1
